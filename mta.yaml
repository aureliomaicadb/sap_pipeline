_schema-version: '3.1'
ID: PipeLineDEmo
version: 1.0.0
description: A simple CAP project.

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  subdomain: 2aeea754trial

build-parameters:
  before-all:
    - builder: custom
      commands:
        - rm -rf build/dist
        - mkdir -p build/dist
        - rm -rf build/ui-deployer
        - mkdir -p build/ui-deployer
    - builder: custom
      commands:
        - npm install --production
        - bash -c "cds -v | grep 'cds-dk' || npm i --production --no-save @sap/cds-dk"
        - bash -c "export PATH=$PATH:$(pwd)/node_modules/.bin"
        - cds build --production

modules:

  - name: PipeLineDEmo-booksdemo
    type: html5
    path: app/books-demo
    build-parameters:
      builder: custom
      commands:
        - rm -rf dist
        - npm install
        - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateCachebusterInfo
      build-result: dist
      supported-platforms: []

  - name: PipeLineDEmo-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: PipeLineDEmo-service-uaa
      - name: PipeLineDEmo-service-db

  - name: PipeLineDEmo-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256MB
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: PipeLineDEmo-service-uaa
      - name: PipeLineDEmo-service-db
      - name: PipeLineDEmo-service-destination
      - name: PipeLineDEmo-service-metadata
      - name: PipeLineDEmo-service-connectivity
      - name: PipeLineDEmo-service-logs

  - name: PipeLineDEmo-aux-destinations
    type: com.sap.application.content
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: PipeLineDEmo-service-uaa
              ServiceInstanceName: PipeLineDEmo-uaa
              ServiceKeyName: PipeLineDEmo-uaa-key
              sap.cloud.service: lcap.PipeLineDEmo

            - Authentication: OAuth2UserTokenExchange
              Name: PipeLineDEmo-app-srv
              TokenServiceInstanceName: PipeLineDEmo-uaa
              TokenServiceKeyName: PipeLineDEmo-uaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: lcap.PipeLineDEmo

            - Name: PipeLineDEmo-service-html5-apps-repo-host
              ServiceInstanceName: PipeLineDEmo-html5-apps-repo-host
              ServiceKeyName: PipeLineDEmo-html5-apps-repo-host-key
              sap.cloud.service: lcap.PipeLineDEmo

            - Authentication: OAuth2UserTokenExchange
              Name: PipeLineDEmo-CatalogService
              TokenServiceInstanceName: PipeLineDEmo-uaa
              TokenServiceKeyName: PipeLineDEmo-uaa-key
              URL: ~{srv-api/srv-url}/odata/v4/catalog
              sap.cloud.service: lcap.PipeLineDEmo

    build-parameters:
      no-source: true

    requires:
      - name: PipeLineDEmo-service-uaa
        parameters:
          service-key:
            name: PipeLineDEmo-uaa-key

      - name: srv-api

      - name: PipeLineDEmo-service-html5-apps-repo-host
        parameters:
          service-key:
            name: PipeLineDEmo-html5-apps-repo-host-key

      - name: PipeLineDEmo-service-destination
        parameters:
          content-target: true

resources:

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-uaa
    parameters:
      service: xsuaa
      service-plan: application
      service-name: PipeLineDEmo-uaa
      path: xs-security.json

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-db
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: PipeLineDEmo-db

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-destination
    parameters:
      service: destination
      service-plan: lite
      service-name: PipeLineDEmo-destination

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-connectivity
    parameters:
      service: connectivity
      service-plan: lite
      service-name: PipeLineDEmo-connectivity

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-logs
    parameters:
      service: application-logs
      service-plan: lite
      service-name: PipeLineDEmo-logs

  - type: org.cloudfoundry.managed-service
    name: PipeLineDEmo-service-html5-apps-repo-host
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: PipeLineDEmo-html5-apps-repo-host